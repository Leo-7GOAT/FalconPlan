name: Software regression
on: [push, pull_request]
permissions:
  contents: read
jobs:
  ppo-process:
    # Contracts and an actual learning/inference smoke run. Performance gates
    # remain recorded in evaluation.json and may be PARTIAL; this is not a
    # CARLA or learned-policy safety certification.
    runs-on: ubuntu-22.04
    env:
      MPLBACKEND: Agg
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v7.0.0
        with:
          python-version: '3.11'
          cache: pip
      - run: python -m pip install -e ".[dev,profiling]"
      - run: python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
      - run: python -m pytest -q tests/test_learning_environment.py tests/test_learning_ppo.py
      - run: python -m demos.learning.train_ppo --seed 7 --steps 512 --output artifacts/ci-ppo
      - name: Real learned inference and honest performance evidence
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          from demos.learning.evaluate_ppo import evaluate
          from falcon.learning.environment import ENGINE
          training = json.loads(Path('artifacts/ci-ppo/training_summary.json').read_text())
          assert training['trained_steps'] == 512 and training['parameter_delta_l2'] > 1e-6
          result = evaluate('artifacts/ci-ppo/policy.pt', 'artifacts/ci-ppo-evaluation',
                            seeds=(101,), cases=('ID',), scenarios=('free',))
          assert result['engine'] == ENGINE and result['episodes'] == 3
          assert result['status'] in ('PARTIAL', 'PASS_MODEL_EXPERIMENT')
          assert {r['policy'] for r in result['runs']} == {
              'FSM_IDM_MOBIL', 'PPO_guarded', 'PPO_without_predictive_gate'}
          print('Learning/inference process verified; policy performance:', result['status'])
          PY
      - uses: actions/upload-artifact@v7.0.2
        if: always()
        with:
          name: ppo-process-performance-evidence
          path: |
            artifacts/ci-ppo/
            artifacts/ci-ppo-evaluation/
  python:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, windows-latest]
        python: ['3.10', '3.11']
    env:
      MPLBACKEND: Agg
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v7.0.0
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - run: python -m pip install -e ".[dev,profiling]"
      - run: python -m pytest -q --junitxml=artifacts/ci-python.xml
      - run: python -m demos.w07_dp_qp_speed_demo
      - run: python -m demos.w07_longitudinal_mpc_demo
      - uses: actions/upload-artifact@v7.0.2
        if: always()
        with:
          name: python-${{ matrix.os }}-${{ matrix.python }}
          path: artifacts/ci-python.xml
  cpp:
    runs-on: ubuntu-22.04
    env:
      MPLBACKEND: Agg
    strategy:
      matrix:
        sanitize: ['OFF', 'ON']
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v7.0.0
        with:
          python-version: '3.10'
          cache: pip
      - run: python -m pip install -e ".[dev,profiling]"
      - run: sudo apt-get update && sudo apt-get install -y libgtest-dev ninja-build
      - run: cmake -S cpp -B build/cpp -G Ninja -DFALCON_SANITIZE=${{ matrix.sanitize }} -DCMAKE_BUILD_TYPE=Debug
      - run: cmake --build build/cpp
      - run: ctest --test-dir build/cpp --output-on-failure
      - run: python -m tools.cpp_parity --probe build/cpp/core_probe --output artifacts/ci-cpp-parity.json
      - if: matrix.sanitize == 'OFF'
        env:
          FALCON_PLANNING_CPP_LIBRARY: build/cpp/libfalcon_c.so
        run: python -m pytest -q tests/test_cpp_planning.py
      - if: matrix.sanitize == 'OFF'
        run: python -m tools.cpp_planning_benchmark --library build/cpp/libfalcon_c.so --output artifacts/ci-cpp-planning.json
      - uses: actions/upload-artifact@v7.0.2
        if: always()
        with:
          name: cpp-parity-${{ matrix.sanitize }}
          path: |
            artifacts/ci-cpp-parity.json
            artifacts/ci-cpp-planning.json
