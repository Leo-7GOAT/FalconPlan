name: Software regression
on: [push, pull_request]
permissions:
  contents: read
jobs:
  python:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, windows-latest]
        python: ['3.10', '3.11']
    env:
      MPLBACKEND: Agg
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v7.0.0
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - run: python -m pip install -e ".[dev,profiling]"
      - run: python -m pytest -q --junitxml=artifacts/ci-python.xml
      - run: python -m demos.w07_dp_qp_speed_demo
      - run: python -m demos.w07_longitudinal_mpc_demo
      - uses: actions/upload-artifact@v7.0.2
        if: always()
        with:
          name: python-${{ matrix.os }}-${{ matrix.python }}
          path: artifacts/ci-python.xml
  cpp:
    runs-on: ubuntu-22.04
    env:
      MPLBACKEND: Agg
    strategy:
      matrix:
        sanitize: ['OFF', 'ON']
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v7.0.0
        with:
          python-version: '3.10'
          cache: pip
      - run: python -m pip install -e ".[dev,profiling]"
      - run: sudo apt-get update && sudo apt-get install -y libgtest-dev ninja-build
      - run: cmake -S cpp -B build/cpp -G Ninja -DFALCON_SANITIZE=${{ matrix.sanitize }} -DCMAKE_BUILD_TYPE=Debug
      - run: cmake --build build/cpp
      - run: ctest --test-dir build/cpp --output-on-failure
      - run: python -m tools.cpp_parity --probe build/cpp/core_probe --output artifacts/ci-cpp-parity.json
      - uses: actions/upload-artifact@v7.0.2
        if: always()
        with:
          name: cpp-parity-${{ matrix.sanitize }}
          path: artifacts/ci-cpp-parity.json
