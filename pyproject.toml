[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "falconplan"
version = "0.0.2"
description = "W01-W02 vehicle modeling, coordinate, and HAL foundation"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "numpy>=1.24",
    "scipy>=1.10",
    "matplotlib>=3.7",
]

[project.optional-dependencies]
dev = ["pytest>=7.4"]

[tool.setuptools.packages.find]
include = ["coordinate_system*", "hal*", "vehicle_model*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
