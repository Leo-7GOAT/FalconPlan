[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "falconplan"
version = "0.1.0"
description = "Planning, constrained speed control, safety and real CARLA vehicle software stack"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24",
    "scipy>=1.10",
    "matplotlib>=3.7",
    "osqp>=0.6.3",
    "casadi>=3.6",
]

[project.optional-dependencies]
dev = ["pytest>=7.4"]
sim = ["carla==0.9.15; python_version == '3.10' and sys_platform == 'linux'", "Pillow>=9"]
rl = ["torch>=2.0"]
profiling = ["psutil>=5.9"]

[tool.setuptools.packages.find]
include = ["coordinate_system*", "hal*", "vehicle_model*", "planning*", "control*", "behavior*", "demos*", "tools*", "falcon*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
